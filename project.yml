name: ShhhcribbleiOS
options:
  bundleIdPrefix: com.hendritiuri
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

schemes:
  ShhhcribbleiOS:
    build:
      targets:
        ShhhcribbleShared: all
        ShhhcribbleWidget: all
        ShhhcribbleKeyboard: all
        ShhhcribbleiOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    branch: main
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit.git
    from: "9.0.0"

targets:
  ShhhcribbleShared:
    type: framework
    platform: iOS
    sources:
      - path: ShhhcribbleShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hendritiuri.shhhcribble.shared
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9W82X49JZS
        GENERATE_INFOPLIST_FILE: YES
        # Required by App Store validation for embedded frameworks:
        # the auto-generated Info.plist must include
        # CFBundleShortVersionString. Without these two keys the
        # TestFlight upload fails with "missing plist key".
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  ShhhcribbleiOS:
    type: application
    platform: iOS
    sources:
      - path: ShhhcribbleiOS
        excludes:
          - Info.plist
          - ShhhcribbleiOS.entitlements
    resources:
      - ShhhcribbleiOS/Resources/Assets.xcassets
    info:
      path: ShhhcribbleiOS/Info.plist
      properties:
        CFBundleDisplayName: Shhhcribble
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.hendritiuri.shhhcribble
            CFBundleURLSchemes:
              - shhhcribble
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "Shhhcribble records audio to transcribe your speech. Recording only happens when you trigger it."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Audit M1 — Superwhisper declares this for continuation user
        # activities (Spotlight, Handoff, NSUserActivity restoration).
        # ToggleRecordingIntentIntent is the Apple-generated activity
        # type name from the AppIntent's @AppIntent macro.
        NSUserActivityTypes:
          - ToggleRecordingIntentIntent
        UIBackgroundModes:
          - audio
          - fetch
          - processing
          - push-to-talk
        # push-to-talk background mode enabled 2026-05-19 alongside the
        # com.apple.developer.push-to-talk entitlement granted at App ID
        # level. Lets the PTChannelManager keep its channel + audio
        # session alive across backgrounding, and the system to resume
        # the app via the PT framework when a channel becomes active.
        BGTaskSchedulerPermittedIdentifiers:
          - com.hendritiuri.shhhcribble
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - microphone
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: ShhhcribbleiOS/ShhhcribbleiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shhhcribble.app
        # associated-domains removed 2026-05-19 — Phase H (Universal
        # Links) was empirically ruled out. The Stage 1 URL-tap from
        # Notes did work but isn't useful for the keyboard path which
        # is the actual blocker. Superwhisper doesn't have this either.
        com.apple.developer.push-to-talk: true
        # aps-environment removed 2026-05-19 — was only needed for
        # PTChannelManager init, which we no longer use. Superwhisper
        # doesn't have this entitlement either.
      # App Group restored 2026-05-14 alongside paid Developer Program
      # enrolment (team 9W82X49JZS) ahead of Sprint 5 keyboard extension.
      # Associated Domains (Phase H, take 2 — 2026-05-19): AASA now hosted
      # at the host root via GitHub user-pages repo, fixing yesterday's
      # subpath bug. Match path /keyboard/* in the AASA components.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hendritiuri.shhhcribble
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9W82X49JZS
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ShhhcribbleShared
        embed: true
      - package: FluidAudio
        product: FluidAudio
      - target: ShhhcribbleWidget
        embed: true
      - target: ShhhcribbleKeyboard
        embed: true

  ShhhcribbleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ShhhcribbleWidget
        excludes:
          - ShhhcribbleWidget.entitlements
      # Multi-target source membership: the widget needs StartRecordingIntent
      # for its Control Center button, and Stop/Cancel intents for the Live
      # Activity card. Apple's recommended pattern (since iOS 18) is to share
      # the intent .swift files between targets directly rather than via a
      # framework — AppShortcutsProvider in the main app only registers with
      # iOS when the referenced intents live in the main app target. Adding
      # them here too means each target compiles its own copy.
      - path: ShhhcribbleiOS/App/Intents/StartRecordingIntent.swift
      - path: ShhhcribbleiOS/App/Intents/StopRecordingIntent.swift
      - path: ShhhcribbleiOS/App/Intents/CancelRecordingIntent.swift
      - path: ShhhcribbleiOS/App/Intents/ToggleRecordingIntent.swift
    info:
      path: ShhhcribbleWidget/Info.plist
      properties:
        CFBundleDisplayName: Shhhcribble Widget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ShhhcribbleWidget/ShhhcribbleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shhhcribble.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hendritiuri.shhhcribble.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9W82X49JZS
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - target: ShhhcribbleShared
        embed: false

  # Keyboard target depends on KeyboardKit for the Apple-look-alike key layout.
  # See ShhhcribbleKeyboard target below; FluidAudio is NOT pulled into the
  # keyboard extension (model lives in main app — 70 MB extension cap).
  ShhhcribbleKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ShhhcribbleKeyboard
        excludes:
          - ShhhcribbleKeyboard.entitlements
          - Info.plist
    info:
      path: ShhhcribbleKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Shhhcribble
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # Phase J Tier 2 cleanup — these match Superwhisper's keyboard
        # Info.plist exactly. URLScheme + HostBundleIdentifier are
        # custom keys their code reads at runtime to look up which
        # scheme to open. NSMicrophoneUsageDescription is harmless on
        # a keyboard (it can't actually record) but Superwhisper
        # declares it; some iOS code paths might check it.
        URLScheme: shhhcribble
        HostBundleIdentifier: com.hendritiuri.shhhcribble
        NSMicrophoneUsageDescription: "Record audio for transcribing"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Required so the keyboard extension can read the App Group container.
            # iOS prompts the user the first time they enable Full Access.
            RequestsOpenAccess: true
    entitlements:
      path: ShhhcribbleKeyboard/ShhhcribbleKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shhhcribble.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hendritiuri.shhhcribble.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9W82X49JZS
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - target: ShhhcribbleShared
        embed: false
      - package: KeyboardKit
        product: KeyboardKit
